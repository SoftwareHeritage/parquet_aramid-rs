[package]
name = "parquet_aramid"
readme = "README.md"
version = "0.4.0"
edition = "2021"
description = "Query engine using Parquet tables as a Key-Value store"
repository = "https://gitlab.softwareheritage.org/swh/devel/parquet_aramid-rs"
license = "GPL-3.0-or-later"
keywords = ["parquet", "key-value"]
categories = ["database-implementations"]
rust-version = "1.85"

[dependencies]
anyhow = { version="1.0.79" }
crossbeam-queue = "0.3.11"
itertools = "0.13.0"
num_cpus = "1.16.0"
rdst = { version = "0.20.14" }

# Logging
tracing = "0.1.40"

# Database
bytes = "1.7.1"
arrow = ">=55.0.0, <60"
object_store = { version = ">=0.12.0, <0.14", default-features = false }
parquet = { version = ">=55.0.0, <60", default-features = false, features = ["arrow", "async", "object_store", "zstd"]}
url = "2.2"

# Elias-Fano index
epserde = ">= 0.12.0, <0.14"
sux = { version = ">=0.12.0, <0.16", features = ["epserde"] }

# Tokio & async
futures = "0.3.30"
tokio = { version = "1.0", features = ["rt-multi-thread"] }
tokio-stream = "0.1"

[dev-dependencies]
ar_row = ">=1.2.0, <3"
ar_row_derive = ">=1.2.0, <3"
tempfile = "3.7.1"
tokio-test = "0.4.4"
object_store = { version = ">=0.12.0, <0.14", default-features = false, features = ["fs"] }

[features]
default = []
rayon = ["rdst/multi-threaded"]
