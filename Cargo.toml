[package]
name = "parquet_aramid"
readme = "README.md"
version = "0.3.0"
edition = "2021"
description = "Query engine using Parquet tables as a Key-Value store"
repository = "https://gitlab.softwareheritage.org/swh/devel/parquet_aramid-rs"
license = "GPL-3.0-or-later"
keywords = ["parquet", "key-value"]
categories = ["database-implementations"]
rust-version = "1.85"

[dependencies]
anyhow = { version="1.0.104" }
crossbeam-queue = "0.3.14"
itertools = "0.13.0"
num_cpus = "1.17.0"
rdst = { version = "0.20.14" }

# Logging
tracing = "0.1.44"

# Database
bytes = "1.12.1"
arrow = "57.0.0"
object_store = { version = "0.12.5", default-features = false, features = ["fs"]}
parquet = { version = "57.0.0", default-features = false, features = ["arrow", "async", "object_store", "zstd"]}
url = "2.5"

# Elias-Fano index
epserde = "0.13.2"
sux = { version = "0.15.3", features = ["epserde"] }

# Tokio & async
futures = "0.3.34"
tokio = { version = "1.53", features = ["rt-multi-thread"] }
tokio-stream = "0.1"

[dev-dependencies]
ar_row = "2.1.0"
ar_row_derive = "2.1.0"
tempfile = "3.27.0"
tokio-test = "0.4.6"

[features]
default = []
rayon = ["rdst/multi-threaded"]
